databases:
  - name: relay-registry-db
    plan: free
    databaseName: relay_registry
    user: relay

services:
  - type: web
    name: relay-registry
    runtime: python
    plan: free
    buildCommand: pip install -r registry/requirements.txt
    startCommand: uvicorn registry.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-registry-db
          property: connectionString
