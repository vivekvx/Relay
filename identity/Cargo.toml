[package]
name = "relay-identity"
version = "0.0.0"
edition = "2021"

[dependencies]
crypto-common = { version = "0.2.2", default-features = false }
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
ed25519-dalek = { version = "3.0.0", features = ["digest", "rand_core", "zeroize"] }
rand = "0.10.2"

[dev-dependencies]
serde_json = "1.0.151"
